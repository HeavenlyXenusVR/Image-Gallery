name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit

      - name: Syntax-check every Lua module (loadfile, no execution)
        run: |
          cd lua
          status=0
          for f in $(find . -name '*.lua' -not -path './lib/*'); do
            out=$(luajit -e "local f, err = loadfile('$f'); if not f then print(err); os.exit(1) end" 2>&1)
            if [ $? -ne 0 ]; then
              echo "SYNTAX ERROR in $f: $out"
              status=1
            fi
          done
          exit $status

      - name: Node syntax check (live_proxy/tooling scripts, if any remain)
        run: |
          for f in $(find scripts -name '*.mjs' 2>/dev/null); do
            node --check "$f" || exit 1
          done
