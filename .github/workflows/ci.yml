name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8

      - name: Lint (undefined names / unused imports)
        run: python -m flake8 --select=F app/ tests/ scripts/

      - name: Route ordering / DB method / import sanity
        run: python -c "import app.main"

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Run API route smoke test
        run: python scripts/api_route_test.py
